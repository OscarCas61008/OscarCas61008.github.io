<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Buen Sabor - Inicio</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fdfbf7;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #8b0000;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; }
        .contenedor-menu {
            max-width: 800px;
            margin: 0 auto;
        }
        .imagen-restaurante {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .lista-recetas {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .lista-recetas li {
            background: white;
            padding: 15px 25px;
            border: 2px solid #8b0000;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .lista-recetas li:hover {
            transform: scale(1.05);
        }
        .lista-recetas a {
            text-decoration: none;
            color: #8b0000;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Restaurante "El Buen Sabor"</h1>
    </header>

    <main class="contenedor-menu">
        <!-- Imagen del local (recuerda subir tu imagen a la carpeta img) -->
        <img src="img/local.jpg" alt="Fachada del restaurante El Buen Sabor" class="imagen-restaurante">
        
        <h2>Nuestras Recetas</h2>
        <p>Selecciona una receta para ver su proceso de elaboración:</p>

        <ul class="lista-recetas">
            <!-- Enlace a la receta obligatoria -->
            <li><a href="tortillapatatas.html">Receta: Tortilla de Patatas</a></li>
            
            <!-- Puedes añadir más recetas aquí si quieres -->
            <li><a href="#">Receta: Paella Valenciana</a></li>
            <li><a href="#">Receta: Gazpacho Andaluz</a></li>
        </ul>
    </main>

</body>
</html>
