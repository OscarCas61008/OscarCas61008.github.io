<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Oscar Cas">
    <meta name="description" content="Formulario de contacto del Bar La Estrella">
    <meta name="keywords" content="contacto, formulario, restaurante">
    <title>Contacto - Bar La Estrella</title>
</head>
<body>

    <header>
        <h1>Contacta con nosotros</h1>
        <hr>
    </header>

    <nav>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </nav>

    <main>
        <form action="#" method="post">
            <label>Nombre: <input type="text" name="nombre_contacto"></label><br><br>
            <label>Correo electrónico: <input type="email" name="email_contacto"></label><br><br>
            <label>Asunto: <input type="text" name="asunto"></label><br><br>
            <label>Mensaje:<br>
                <textarea name="mensaje_contacto" rows="5" cols="40"></textarea>
            </label><br><br>
            
            <input type="submit" value="Enviar Mensaje">
        </form>
    </main>

    <footer>
        <hr>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </footer>

</body>
</html>
