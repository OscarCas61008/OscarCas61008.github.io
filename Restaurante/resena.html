<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Oscar Cas">
    <meta name="description" content="Formulario de reseña del Bar La Estrella">
    <meta name="keywords" content="reseña, opinion, formulario, restaurante">
    <title>Dejar una Reseña - Bar La Estrella</title>
</head>
<body>

    <header>
        <h1>Deja tu reseña</h1>
        <hr>
    </header>

    <nav>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </nav>

    <main>
        <form action="#" method="post">
            <label>Selecciona el plato:
                <select name="plato">
                    <option value="tortilla">Tortilla de Patatas</option>
                    <option value="salmorejo">Salmorejo Cordobés</option>
                    <option value="flamenquin">Flamenquín Cordobés</option>
                </select>
            </label><br><br>

            <label>Tu nombre: <input type="text" name="nombre_resena"></label><br><br>

            <label>Tu reseña:<br>
                <textarea name="texto_resena" rows="5" cols="40"></textarea>
            </label><br><br>
            
            <input type="submit" value="Enviar Reseña">
        </form>
    </main>

    <footer>
        <hr>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </footer>

</body>
</html>
