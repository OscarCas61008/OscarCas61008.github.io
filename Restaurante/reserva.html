<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Oscar Cas">
    <meta name="description" content="Formulario de reserva del Bar La Estrella">
    <meta name="keywords" content="reserva, formulario, restaurante">
    <title>Hacer una Reserva - Bar La Estrella</title>
</head>
<body>

    <header>
        <h1>Haz una reserva</h1>
        <hr>
    </header>

    <nav>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </nav>

    <main>
        <form action="#" method="post">
            <label>Su nombre: <input type="text" name="nombre_reserva" placeholder="Su nombre"></label><br><br>
            <label>Número de clientes: <input type="number" name="clientes" placeholder="Número de clientes"></label><br><br>
            <label>Su correo electrónico: <input type="email" name="email_reserva" placeholder="Su correo electrónico"></label><br><br>
            <label>Su teléfono: <input type="tel" name="telefono_reserva" placeholder="Su teléfono"></label><br><br>
            <label>Fecha de la reserva: <input type="date" name="fecha_reserva"></label><br><br>
            <label>Hora de la reserva: <input type="time" name="hora_reserva"></label><br><br>
            <label>Su mensaje:<br>
                <textarea name="mensaje_reserva" rows="3" cols="40" placeholder="Su mensaje"></textarea>
            </label><br><br>
            
            <input type="submit" value="SOLICITAR RESERVA">
        </form>
        <p>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#">Política de privacidad</a></p>
    </main>

    <footer>
        <hr>
        <p><a href="index.html">Volver al menú del restaurante</a></p>
    </footer>

</body>
</html>
